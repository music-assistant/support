# Music Assistant issue triage (experimental).
#
# Analyses newly opened/edited issues: validates an attached diagnostics file,
# posts a single sticky summary comment, applies setup/provider labels and
# manages the needs-attention / waiting-for-user response state.
#
# SAFETY:
# * All issue content is treated as untrusted and is passed to the script via
#   `env:` only — never interpolated into a shell command.
# * Least-privilege token; downloads are host-allowlisted and byte-capped.
# * Defaults to DRY-RUN (set the repo variable TRIAGE_DRY_RUN=false to go live).
name: Issue triage

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  # Manual re-triage of an existing issue (e.g. to backfill after a change).
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to (re)triage
        required: true

# One run at a time per issue; queue rather than cancel so state stays coherent.
concurrency:
  group: triage-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Searches a checkout of the server repository for the code behind the report,
  # and writes the paths it finds for `analyze` to pick up.
  #
  # Separate from `analyze` on purpose, and for the same reason `index-append` is
  # separate: this job runs a model with search tools over text a member of the
  # public wrote, so it must not be the job that can comment. It holds no app
  # token, and neither checkout keeps its credentials on disk — a process that
  # can read files is a process that can read `.git/config`.
  trace:
    # Gated at the job, not only in the script: with tracing off there is no
    # consumer for a traced path, and an ungated job would still pay for two
    # checkouts and a CLI install on every issue while `analyze` waited on it.
    if: >-
      ${{ vars.TRIAGE_CODE_TRACE_ENABLED == 'true'
      && vars.TRIAGE_AI_ENABLED == 'true'
      && ((github.event_name == 'issues' && !github.event.issue.pull_request)
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # `analyze` waits on this job, so a slow trace delays the comment a reporter
    # is waiting for. The search stops itself after six and a half minutes
    # (TRIAGE_CODE_TRACE_TIMEOUT); this bounds the checkouts and installs around
    # it, which measure about fifteen seconds together. Seven minutes here and
    # three on `analyze` hold the pair to the ten a reporter may wait, whatever
    # either does.
    timeout-minutes: 7
    permissions:
      contents: read
      # Reading the issue on a manual dispatch. A public repo can be read
      # unauthenticated, but that shares a 60/hour limit across every runner on
      # the same address, so it fails intermittently rather than never.
      issues: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: music-assistant/server
          ref: ${{ vars.TRIAGE_SERVER_REF || 'dev' }}
          path: server
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt
      - uses: ./.github/actions/setup-copilot
      - name: Fetch the reported problem
        # A manual dispatch carries no issue payload. The token lives in this
        # step alone: the step after it launches a model holding file-reading
        # tools, and must not have a credential anywhere in its environment.
        # `gh api` authenticated from GH_TOKEN leaves nothing on disk either —
        # only `gh auth login` writes a credential file — so the fetched copy is
        # the public issue text and nothing more.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          gh api "/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '{title, body}' > "${RUNNER_TEMP}/issue.json"
      - name: Trace the code behind the report
        working-directory: .github/scripts
        env:
          # Untrusted content — safe because it is an env var, not shell input.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Only read when the payload above is empty, which is the dispatch
          # case; an issue event always carries a title.
          TRIAGE_ISSUE_FILE: ${{ runner.temp }}/issue.json
          TRIAGE_CODE_TRACE_ENABLED: ${{ vars.TRIAGE_CODE_TRACE_ENABLED }}
          TRIAGE_SERVER_CHECKOUT: ${{ github.workspace }}/server
          TRIAGE_TRACED_PATHS: ${{ runner.temp }}/traced-paths.json
          # Falls through to the workflow token once org Copilot seats exist,
          # so moving off the personal PAT is a secret deletion. Matches the
          # `analyze` job, which already runs on the same credential.
          #
          # KNOWN EXPOSURE while the PAT is the credential in use: this job
          # grants the model file-reading tools, and `/proc/self/environ` is a
          # file, so the token in this environment is readable by the model
          # that issue text is steering. It cannot be sent anywhere from here —
          # no granted binary opens a network connection, and the only output
          # channel is a path list filtered against the checkout — but it can
          # be read into a prompt. The built-in token closes that off, and is
          # refused until the org configures Copilot seats.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        run: python -m ma_triage trace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traced-paths
          path: ${{ runner.temp }}/traced-paths.json
          if-no-files-found: ignore
          retention-days: 1

  analyze:
    # Opened/edited/reopened issues (never PRs), or a manual dispatch.
    #
    # `needs: trace` only orders the two; `!cancelled()` keeps this job running
    # when the trace failed, timed out or was skipped. Code tracing is an
    # optimisation and deterministic triage must not depend on it, while a
    # cancelled run still stops.
    needs: [trace]
    # Bounds the half of the wait this job owns. It measures well under two
    # minutes; this is a backstop, not a target.
    timeout-minutes: 3
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'issues' && !github.event.issue.pull_request)
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
      copilot-requests: write # used only once org Copilot seats exist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create triage App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-discussions: read
          permission-issues: write
          permission-metadata: read
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt
      - uses: ./.github/actions/start-embeddings
      - uses: ./.github/actions/setup-copilot
      - name: Collect the traced paths
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: traced-paths
          path: ${{ runner.temp }}
      - name: Triage issue
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TRIAGE_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          # Untrusted content — safe because it is an env var, not shell input.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TRIAGE_DRY_RUN: ${{ vars.TRIAGE_DRY_RUN }}
          TRIAGE_AI_ENABLED: ${{ vars.TRIAGE_AI_ENABLED }}
          TRIAGE_AI_MODEL: ${{ vars.TRIAGE_AI_MODEL }}
          TRIAGE_SCAN_LOGS: ${{ vars.TRIAGE_SCAN_LOGS }}
          # RAG layer (Phase 2) — only active when TRIAGE_AI_ENABLED is true.
          TRIAGE_RAG_ENABLED: ${{ vars.TRIAGE_RAG_ENABLED }}
          TRIAGE_ANSWER_MODEL: ${{ vars.TRIAGE_ANSWER_MODEL }}
          TRIAGE_ANSWER_HI: ${{ vars.TRIAGE_ANSWER_HI }}
          TRIAGE_ANSWER_LO: ${{ vars.TRIAGE_ANSWER_LO }}
          TRIAGE_DOCS_REPO: ${{ vars.TRIAGE_DOCS_REPO }}
          TRIAGE_SERVER_REF: ${{ vars.TRIAGE_SERVER_REF }}
          # Written by the `trace` job. Absent whenever tracing is off or the
          # trace did not finish, which reads as "no traced paths".
          TRIAGE_TRACED_PATHS: ${{ runner.temp }}/traced-paths.json
          TRIAGE_INDEX_BRANCH: ${{ vars.TRIAGE_INDEX_BRANCH }}
          TRIAGE_DOCS_MAX_PER_PAGE: ${{ vars.TRIAGE_DOCS_MAX_PER_PAGE }}
          TRIAGE_RELATED_POSTS: ${{ vars.TRIAGE_RELATED_POSTS }}
          TRIAGE_RELATED_MIN_SCORE: ${{ vars.TRIAGE_RELATED_MIN_SCORE }}
          TRIAGE_RELATED_EXPAND_SCORE: ${{ vars.TRIAGE_RELATED_EXPAND_SCORE }}
          TRIAGE_PINNED_EXCLUDE_CATEGORIES: ${{ vars.TRIAGE_PINNED_EXCLUDE_CATEGORIES }}
          TRIAGE_PINNED_MAX_PROVIDERS: ${{ vars.TRIAGE_PINNED_MAX_PROVIDERS }}
          # Optional PAT for GitHub Models (used only when set); falls back to
          # the default token. Lets Models work when the org token can't.
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          # Falls through to the workflow token once org Copilot seats exist,
          # so switching off the personal PAT is a secret deletion.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT || secrets.GITHUB_TOKEN }}
        run: python -m ma_triage triage

  respond:
    # New comments on issues (skip the bot's own comments and PR comments).
    if: >-
      ${{ github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create triage App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          permission-issues: write
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt
      - name: Update response state
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TRIAGE_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          TRIAGE_DRY_RUN: ${{ vars.TRIAGE_DRY_RUN }}
        run: python -m ma_triage respond

  # Separate, least-privilege job: embed a newly-opened issue and append it to
  # the posts index on the `triage-index` branch. It has `contents: write` (to
  # commit the index) but deliberately NOT `issues: write` — so the job that can
  # write repo contents can never comment, and vice-versa. Only runs when the AI
  # layer is enabled (it makes one embedding call).
  index-append:
    if: >-
      ${{ github.event_name == 'issues'
      && github.event.action == 'opened'
      && !github.event.issue.pull_request
      && vars.TRIAGE_AI_ENABLED == 'true'
      && vars.TRIAGE_RAG_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    # Serialise with the nightly index build (and other appends) so concurrent
    # force-pushes to the triage-index branch can't drop each other's writes.
    concurrency:
      group: rag-index-write
      cancel-in-progress: false
    permissions:
      contents: write # commit the posts index to the triage-index branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt
      - uses: ./.github/actions/start-embeddings
      - name: Append issue to posts index
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_DRY_RUN: ${{ vars.TRIAGE_DRY_RUN }}
          TRIAGE_AI_ENABLED: ${{ vars.TRIAGE_AI_ENABLED }}
          TRIAGE_RAG_ENABLED: ${{ vars.TRIAGE_RAG_ENABLED }}
          TRIAGE_INDEX_BRANCH: ${{ vars.TRIAGE_INDEX_BRANCH }}
          TRIAGE_INDEX_MAX_POSTS: ${{ vars.TRIAGE_INDEX_MAX_POSTS }}
        run: python -m ma_triage index-append
