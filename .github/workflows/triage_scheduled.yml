# Scheduled triage sweep (experimental).
#
# Once a day, walks open `waiting-for-user` issues and — based on days since the
# reporter was last active — sends a gentle reminder (3d), a close warning (7d)
# and finally auto-closes (14d). Issues labelled bug/enhancement/pinned/etc. are
# exempt. Honours the same TRIAGE_DRY_RUN kill switch as the main workflow.
name: Issue triage sweep

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: {}

concurrency:
  group: triage-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create triage App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          permission-issues: write
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: .github/scripts
        run: pip install -r requirements.txt
      - name: Run sweep
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TRIAGE_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          REPOSITORY: ${{ github.repository }}
          TRIAGE_DRY_RUN: ${{ vars.TRIAGE_DRY_RUN }}
        run: python -m ma_triage sweep
